<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1080" viewBox="0 0 1800 1080" role="img" aria-labelledby="title desc">
  <title id="title">Gas Plasma theme mockup</title>
  <desc id="desc">A polished design mockup showing Gas Plasma in Terminal, iTerm2, VS Code, and Zed.</desc>
  <defs>
    <linearGradient id="stage" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF7F4"/>
      <stop offset=".48" stop-color="#FFEFE5"/>
      <stop offset="1" stop-color="#FFE9D9"/>
    </linearGradient>
    <linearGradient id="window" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFECE1"/>
      <stop offset="1" stop-color="#FFF5F0"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#CE3B00"/>
      <stop offset=".5" stop-color="#956300"/>
      <stop offset="1" stop-color="#94641C"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="28" stdDeviation="28" flood-color="#5C2400" flood-opacity=".2"/>
    </filter>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0v42" fill="none" stroke="#FFDDC5" stroke-width="1" opacity=".3"/>
    </pattern>
  </defs>
  <rect width="1800" height="1080" fill="url(#stage)"/>
  <rect width="1800" height="1080" fill="url(#grid)"/>
  <path d="M0 844C260 770 434 824 652 760c250-73 374-272 666-256 184 10 328 92 482 54v522H0z" fill="#FFF5EF" opacity=".62"/>
