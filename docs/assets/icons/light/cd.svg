      <stop offset="1" stop-color="#FFF9F7"/>
    </linearGradient>
    <linearGradient id="ember" x1="20" y1="15" x2="76" y2="83" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#592C00"/>
      <stop offset=".28" stop-color="#B68600"/>
      <stop offset=".72" stop-color="#D67200"/>
      <stop offset="1" stop-color="#FF4500"/>
    </linearGradient>
    <linearGradient id="panel" x1="24" y1="24" x2="72" y2="72" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFE7D5"/>
