name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build and verify
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build generated artifacts
        run: npm run build
      - name: Run checks
        run: npm run check
      - name: Package VSIX
        run: npm run package
      - name: Verify generated text files are current
        run: |
          git diff --exit-code -- \
            GasPlasma.itermcolors \
            GasPlasma-Light.itermcolors \
            GasPlasma-Auto.itermcolors \
            GasPlasma-ColorBlind.itermcolors \
            GasPlasma-ColorBlind-Light.itermcolors \
            GasPlasma-ColorBlind-Auto.itermcolors \
            themes/gas-plasma-color-theme.json \
            themes/gas-plasma-light-color-theme.json \
            themes/gas-plasma-colorblind-color-theme.json \
            themes/gas-plasma-colorblind-light-color-theme.json \
            assets/mockup-colorblind.svg \
            assets/mockup-colorblind.png \
            docs/assets/mockup-colorblind.svg \
            docs/assets/mockup-colorblind.png \
            icons/file \
            assets/mockup-light.svg \
            assets/mockup-light.png \
            docs/assets/mockup-light.svg \
            docs/assets/mockup-light.png \
            docs/assets/architecture-light.svg \
            docs/assets/architecture-light.png \
            docs/assets/icons \
            docs/assets/screenshots \
            assets/logo.svg \
            assets/logo.png \
            assets/architecture.svg \
            assets/architecture.png \
            assets/mockup.svg \
            assets/mockup.png \
            docs/assets/logo.svg \
            docs/assets/logo.png \
            docs/assets/architecture.svg \
            docs/assets/architecture.png \
            docs/assets/mockup.svg \
            docs/assets/mockup.png \
            docs/index.html \
            zed/gas-plasma-theme/extension.toml \
            zed/gas-plasma-theme/LICENSE \
            zed/gas-plasma-theme/themes/gas-plasma.json \
            zed/gas-plasma-icons/extension.toml \
            zed/gas-plasma-icons/LICENSE \
            zed/gas-plasma-icons/icon_themes/gas-plasma-icons.json \
            zed/gas-plasma-icons/icons
